<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — BlockCert AI</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div id="partial-navbar"></div>
  <main id="main" class="auth-wrap">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="sub">What can I do here? Request a password reset for your BlockCert AI account.</p>

      <div class="alert" id="pageAlert" role="alert"></div>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Account email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="forgotBtn">Request reset link</button>
      </form>

      <p class="small muted mt-2 mb-0">Remembered it? <a href="/login.html">Back to login</a></p>
    </div>
  </main>
  <div id="partial-footer"></div>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
