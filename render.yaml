services:
  - type: web
    name: blockcert-ai-hari2411
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false        # cloud Postgres (Neon) connection string, set in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://blockcert-ai-hari2411.onrender.com
      # The chain is ephemeral by design: scripts/cloud-boot.js starts an
      # in-process Ganache, deploys CertificateRegistry and re-registers the
      # certificates from the database on EVERY boot — no manual keys needed.
      # BLOCKCHAIN_RPC_URL / BLOCKCHAIN_PRIVATE_KEY / CONTRACT_ADDRESS set in
      # the dashboard would be overwritten at boot anyway.
      - key: AI_API_KEY
        sync: false        # Gemini/OpenAI-compatible key, set in the dashboard
      - key: AI_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_MODEL_FALLBACKS
        value: gemini-flash-lite-latest,gemini-3.5-flash-lite,gemini-3.5-flash
      - key: ADMIN_NAME
        value: Demo Admin
      - key: ADMIN_EMAIL
        value: admin@demo.com
      - key: ADMIN_PASSWORD
        sync: false        # bootstrap admin password, set in the dashboard
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "10"

# Persistent database is EXTERNAL (Neon, DATABASE_URL env) — not a Render DB,
# so the data (users, certificates, verifications) outlives any free-plan
# database expiry.