services:
  - type: web
    name: blockcert-ai-hari2411
    runtime: node
    plan: free
    buildCommand: npm ci
    # Base the machine on the deploy context so subshells keep working on Linux
    startCommand: npm run db:migrate && (node scripts/create-admin.js || true) && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false        # cloud Postgres (Neon) connection string, set in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://blockcert-ai-hari2411.onrender.com
      - key: BLOCKCHAIN_RPC_URL
        sync: false        # optional: leave blank; app runs with blockchain_status=not_configured
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: AI_API_KEY
        sync: false        # Gemini/OpenAI-compatible key, set in the dashboard
      - key: AI_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_MODEL_FALLBACKS
        value: gemini-flash-lite-latest,gemini-3.5-flash-lite,gemini-3.5-flash
      - key: ADMIN_NAME
        value: Demo Admin
      - key: ADMIN_EMAIL
        value: admin@demo.com
      - key: ADMIN_PASSWORD
        sync: false        # bootstrap admin password, set in the dashboard
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "10"

databases:
  - name: blockcert-ai-db
    databaseName: blockcert
    user: blockcert
    plan: free
    postgresMajorVersion: "16"
