services:
  - type: web
    name: blockcert-ai-hari2411
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blockcert-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://blockcert-ai-hari2411.onrender.com
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "10"

databases:
  - name: blockcert-ai-db
    databaseName: blockcert
    user: blockcert
    plan: free
    postgresMajorVersion: "16"
